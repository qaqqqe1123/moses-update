<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOSES — 专业硬件工具箱</title>
  <meta name="description" content="MOSES 专业硬件工具箱。CPU 超频、AMD 分核负压、DDR4/DDR5 内存调校。" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #071018;
      --bg-2: #0b1520;
      --ink: #eef5fa;
      --muted: #8499ad;
      --teal: #2dd4bf;
      --teal-deep: #0f766e;
      --line: #1c2e3d;
      --font-display: "Syne", "Segoe UI", sans-serif;
      --font-body: "Microsoft YaHei UI", "PingFang SC", "Manrope", "Segoe UI", sans-serif;
      --font-zh: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", sans-serif;
      --brand-size: clamp(2.5rem, 3.2vw + 1.1rem, 3.6rem);
      --max: 1080px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--teal); color: #04201b; }
    img { display: block; max-width: 100%; }

    /* ========== HERO ========== */
    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      isolation: isolate;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(105deg, rgba(7, 16, 24, 0.92) 0%, rgba(7, 16, 24, 0.55) 42%, rgba(7, 16, 24, 0.2) 100%),
        radial-gradient(ellipse 70% 80% at 85% 40%, rgba(45, 212, 191, 0.18), transparent 55%),
        linear-gradient(160deg, #0a1520, #060d14 60%, #050a10);
    }

    .hero-bg__art {
      position: absolute;
      right: -4%;
      top: 50%;
      transform: translateY(-50%);
      width: min(56vw, 620px);
      opacity: 0.22;
      filter: blur(0.2px);
      pointer-events: none;
      animation: drift 14s ease-in-out infinite;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(100% - 2.5rem, var(--max));
      margin: 0 auto;
      padding: 1.35rem 0;
      animation: in 0.7s ease both;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.14em;
    }
    .nav-logo img {
      width: 28px;
      height: 28px;
    }
    .nav a {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav a:hover { color: var(--teal); }

    .hero-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 2rem;
      width: min(100% - 2.5rem, var(--max));
      margin: 0 auto;
      padding: 1rem 0 3.5rem;
    }

    .hero-copy { animation: in 0.85s ease 0.05s both; }

    .brand {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: var(--brand-size);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      color: #f4fbff;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }
    .brand .en { font-family: var(--font-display); }
    .brand .zh {
      font-family: var(--font-zh);
      font-weight: 700;
      font-size: 0.72em;
      letter-spacing: 0.04em;
      margin-left: 0.08em;
      vertical-align: 0.06em;
    }
    .brand b {
      font-weight: inherit;
      color: var(--teal);
    }

    .lede {
      max-width: 22rem;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 400;
      margin-bottom: 1.75rem;
      font-family: var(--font-zh);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-bottom: 0.9rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.9rem;
      padding: 0 1.35rem;
      font-family: var(--font-zh);
      font-size: 0.92rem;
      font-weight: 700;
      border-radius: 2px;
      border: 1px solid transparent;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s;
    }
    .btn-main {
      background: var(--teal);
      color: #04201b;
    }
    .btn-main:hover {
      background: #5eead4;
      transform: translateY(-1px);
    }
    .btn-sub {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
    }
    .btn-sub:hover {
      border-color: var(--teal);
      color: var(--teal);
    }

    .meta {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 500;
    }
    .meta strong { color: #c9d8e4; font-weight: 600; }

    .hero-media {
      display: flex;
      justify-content: center;
      align-items: center;
      animation: in 0.95s ease 0.12s both;
    }

    .hero-media figure {
      margin: 0;
      width: min(100%, 300px);
      aspect-ratio: 1;
      position: relative;
    }

    .hero-media figure::before {
      content: "";
      position: absolute;
      inset: -12%;
      border: 1px solid rgba(45, 212, 191, 0.2);
      border-radius: 50%;
      animation: spin 48s linear infinite;
    }

    .hero-media img {
      width: 300px;
      height: 300px;
      max-width: 100%;
      object-fit: contain;
      position: relative;
      z-index: 1;
      animation: float 6s ease-in-out infinite;
      filter: drop-shadow(0 20px 36px rgba(0, 0, 0, 0.4));
    }

    /* ========== SECTION ========== */
    .wrap {
      width: min(100% - 2.5rem, var(--max));
      margin: 0 auto;
    }

    .panel {
      padding: 4.25rem 0 4.75rem;
      border-top: 1px solid var(--line);
    }

    .panel-head {
      margin-bottom: 2rem;
      max-width: 28rem;
    }
    .panel-head .label {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 0.55rem;
    }
    .panel-head h2 {
      font-family: var(--font-zh);
      font-size: clamp(1.45rem, 1.5vw + 1rem, 1.85rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
    }
    .panel-head p {
      color: var(--muted);
      font-size: 1rem;
      font-family: var(--font-zh);
    }

    .list {
      list-style: none;
      display: grid;
      gap: 0;
      border-top: 1px solid var(--line);
    }
    .list li {
      display: grid;
      grid-template-columns: 9.5rem 1fr;
      gap: 1.25rem;
      align-items: baseline;
      padding: 1.2rem 0;
      border-bottom: 1px solid var(--line);
      transition: padding-left 0.25s ease;
    }
    .list li:hover { padding-left: 0.4rem; }
    .list .t {
      font-family: var(--font-zh);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--teal);
    }
    .list .d {
      color: #c5d3df;
      font-size: 0.98rem;
      font-weight: 400;
      font-family: var(--font-zh);
    }

    .contact {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.35rem 0 3.5rem;
      border-top: 1px solid var(--line);
    }
    .contact h3 {
      font-family: var(--font-zh);
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
    }
    .contact p { color: var(--muted); font-size: 0.95rem; font-family: var(--font-zh); }
    .contact button {
      font-family: var(--font-zh);
      font-weight: 700;
      font-size: 1rem;
      color: var(--teal);
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      cursor: pointer;
      padding: 0.2rem 0;
      transition: border-color 0.2s;
    }
    .contact button:hover { border-bottom-color: var(--teal); }

    footer {
      width: min(100% - 2.5rem, var(--max));
      margin: 0 auto;
      padding: 1.25rem 0 2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.6rem 1.2rem;
      color: var(--muted);
      font-size: 0.86rem;
      border-top: 1px solid var(--line);
    }
    footer a:hover { color: var(--teal); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.4rem;
      transform: translate(-50%, 140%);
      background: var(--bg-2);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 0.65rem 1rem;
      font-size: 0.88rem;
      z-index: 20;
      transition: transform 0.3s ease;
      pointer-events: none;
    }
    .toast.on { transform: translate(-50%, 0); }

    @keyframes in {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes drift {
      0%, 100% { transform: translateY(-50%) translateX(0); }
      50% { transform: translateY(-52%) translateX(-12px); }
    }

    @media (max-width: 840px) {
      .hero-body {
        grid-template-columns: 1fr;
        text-align: center;
        padding-top: 0.5rem;
      }
      .lede { margin-inline: auto; }
      .actions { justify-content: center; }
      .hero-media { order: -1; }
      .hero-media figure { width: min(58vw, 220px); }
      .hero-media img { width: 220px; height: 220px; }
      .hero-bg__art { opacity: 0.12; width: 80vw; right: -20%; }
      .list li {
        grid-template-columns: 1fr;
        gap: 0.25rem;
        text-align: left;
      }
      .contact { flex-direction: column; align-items: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

    <div class="hero-body">

        <div class="actions">

      <div class="panel-head">

  <footer>
    <span>© 2026 MOSES · 抖音：MOSES</span>
    <span>
      <a href="https://4275.com/bqtgku" target="_blank" rel="noopener">国内下载</a>

      <a href="https://cdn.jsdelivr.net/gh/qaqqqe1123/moses-update@main/latest.json" target="_blank" rel="noopener">更新清单</a>
    </span>

  <div class="toast" id="toast">抖音号已复制</div>

  <script>
    (function () {
      var feeds = [
        "https://cdn.jsdelivr.net/gh/qaqqqe1123/moses-update@main/latest.json",
        "https://raw.githubusercontent.com/qaqqqe1123/moses-update/main/latest.json",
        "https://ghfast.top/https://raw.githubusercontent.com/qaqqqe1123/moses-update/main/latest.json"
      ];
      var btn = document.getElementById("downloadBtn");
      var btnCn = document.getElementById("downloadBtnCn");
      var ver = document.getElementById("verLabel");

      function apply(data) {
        if (!data) return;
        if (data.version) ver.textContent = "v" + data.version;
        if (data.download_url) btn.href = data.download_url;
        if (data.download_url_cn) btnCn.href = data.download_url_cn;
      }

      function tryFeed(i) {
        if (i >= feeds.length) return;
        fetch(feeds[i], { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
          .then(apply)
          .catch(function () { tryFeed(i + 1); });
      }
      tryFeed(0);

      var dy = document.getElementById("copyDy");
      var toast = document.getElementById("toast");
      var timer;
      dy.addEventListener("click", function () {
        var text = dy.getAttribute("data-id") || "MOSES";
        function show() {
          toast.classList.add("on");
          clearTimeout(timer);
          timer = setTimeout(function () { toast.classList.remove("on"); }, 1600);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(show).catch(function () {
            window.prompt("复制抖音号", text);
          });
        } else {
          window.prompt("复制抖音号", text);
        }
      });
    })();
  </script>

</html>
