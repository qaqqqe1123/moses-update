<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOSES — 专业硬件工具箱</title>
  <meta name="description" content="MOSES 专业硬件检测、AMD/Intel 调校与压力测试工具箱。一键下载安装。" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1218;
      --bg-deep: #060a0e;
      --ink: #e8eef4;
      --muted: #8ba3b8;
      --teal: #2dd4bf;
      --teal-dim: #14b8a6;
      --line: #1a2a38;
      --panel: #0e1820;
      --font-display: "Syne", sans-serif;
      --font-body: "DM Sans", sans-serif;
      --download: "https://github.com/qaqqqe1123/moses-update/releases/download/v1.0.0/MOSES_Setup_v1.0.0.exe";
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg-deep);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    /* —— Hero: one composition, full-bleed —— */
    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
      isolation: isolate;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 90% 70% at 70% 40%, rgba(45, 212, 191, 0.14), transparent 55%),
        radial-gradient(ellipse 60% 50% at 15% 80%, rgba(74, 112, 145, 0.2), transparent 50%),
        linear-gradient(165deg, #0b1218 0%, #081018 45%, #060a0e 100%);
    }

    .hero-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(26, 42, 56, 0.45) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26, 42, 56, 0.45) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black, transparent 75%);
      opacity: 0.55;
      animation: gridDrift 28s linear infinite;
    }

    @keyframes gridDrift {
      from { background-position: 0 0, 0 0; }
      to { background-position: 64px 32px, 64px 32px; }
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.75rem;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
    }

    .topbar-mark {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      color: var(--ink);
    }

    .topbar-mark span { color: var(--teal); }

    .hero-stage {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      align-items: center;
      gap: 2rem 3rem;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem 1.75rem 3.5rem;
    }

    .hero-copy {
      animation: riseIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .brand {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(3.6rem, 9vw, 6.5rem);
      line-height: 0.92;
      letter-spacing: -0.03em;
      color: #f0f9ff;
      margin-bottom: 1.1rem;
    }

    .brand em {
      font-style: normal;
      color: var(--teal);
    }

    .lede {
      max-width: 28rem;
      font-size: clamp(1.05rem, 2.2vw, 1.2rem);
      color: var(--muted);
      font-weight: 400;
      margin-bottom: 1.85rem;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.85rem 1.1rem;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.95rem 1.55rem;
      background: var(--teal);
      color: #06201c;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.02em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .btn-download:hover {
      background: #5eead4;
      transform: translateY(-2px);
    }

    .btn-download:active { transform: translateY(0); }

    .btn-meta {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .btn-meta a {
      color: var(--teal);
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .btn-meta a:hover { border-bottom-color: var(--teal); }

    .hero-visual {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: riseIn 1.05s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
    }

    .hero-visual img {
      width: min(100%, 420px);
      height: auto;
      display: block;
      filter: drop-shadow(0 24px 48px rgba(0, 0, 0, 0.45));
      animation: floatY 5.5s ease-in-out infinite;
    }

    .orbit {
      position: absolute;
      width: min(92%, 460px);
      aspect-ratio: 1;
      border: 1px solid rgba(45, 212, 191, 0.18);
      border-radius: 50%;
      pointer-events: none;
      animation: spinSlow 48s linear infinite;
    }
    .orbit::before {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--teal);
      border-radius: 50%;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.15);
    }

    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes spinSlow { to { transform: rotate(360deg); } }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* —— Below fold: one job —— */
    .section {
      max-width: 1120px;
      margin: 0 auto;
      padding: 4.5rem 1.75rem 5rem;
      border-top: 1px solid var(--line);
    }

    .section h2 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.6rem, 3vw, 2rem);
      letter-spacing: -0.02em;
      margin-bottom: 0.65rem;
    }

    .section > p {
      color: var(--muted);
      max-width: 36rem;
      margin-bottom: 2rem;
    }

    .feature-list {
      list-style: none;
      display: grid;
      gap: 0;
      border-top: 1px solid var(--line);
    }

    .feature-list li {
      display: grid;
      grid-template-columns: 7rem 1fr;
      gap: 1rem;
      padding: 1.15rem 0;
      border-bottom: 1px solid var(--line);
      align-items: baseline;
    }

    .feature-list .tag {
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--teal);
    }

    .feature-list .desc {
      color: var(--ink);
      font-size: 1.02rem;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 1.5rem 1.75rem 2.25rem;
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.5rem;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer a { color: var(--muted); }
    footer a:hover { color: var(--teal); }

    @media (max-width: 820px) {
      .hero-stage {
        grid-template-columns: 1fr;
        text-align: center;
        padding-top: 0.5rem;
      }
      .lede { margin-left: auto; margin-right: auto; }
      .cta-row { justify-content: center; }
      .hero-visual { order: -1; padding-top: 0.5rem; }
      .hero-visual img { width: min(68vw, 280px); }
      .orbit { width: min(78vw, 320px); }
      .feature-list li {
        grid-template-columns: 1fr;
        gap: 0.35rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <header class="hero">

    <div class="topbar">
      <div class="topbar-mark">MOSES <span>·</span> TOOLKIT</div>

  <footer>
    <span>© 2026 MOSES · 作者 aaocaaa</span>

  <script>
    (function () {

</body>
</html>
