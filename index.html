<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOSES — 专业硬件工具箱</title>
  <meta name="description" content="MOSES 专业硬件工具箱。CPU 超频、AMD 分核负压、DDR4/DDR5 内存调校。" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070d12;
      --ink: #eef6fb;
      --muted: #7f96ab;
      --teal: #2dd4bf;
      --teal-soft: rgba(45, 212, 191, 0.14);
      --line: rgba(45, 100, 130, 0.28);
      --steel: #4a7091;
      --font-display: "Syne", sans-serif;
      --font-body: "Outfit", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--teal); color: #06201c; }

    /* —— Hero —— */
    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
      isolation: isolate;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(ellipse 80% 55% at 78% 28%, rgba(45, 212, 191, 0.16), transparent 58%),
        radial-gradient(ellipse 55% 45% at 8% 88%, rgba(74, 112, 145, 0.22), transparent 55%),
        linear-gradient(160deg, #0b141c 0%, #070d12 52%, #05090d 100%);
    }

    .hero-bg__mesh {
      position: absolute;
      inset: 0;
      z-index: -2;
      background-image:
        linear-gradient(rgba(26, 48, 64, 0.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26, 48, 64, 0.35) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse 75% 65% at 55% 35%, #000 20%, transparent 72%);
      animation: meshDrift 32s linear infinite;
      opacity: 0.7;
    }

    .hero-bg__beam {
      position: absolute;
      width: 42vw;
      height: 42vw;
      max-width: 560px;
      max-height: 560px;
      right: 6%;
      top: 18%;
      z-index: -1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(45, 212, 191, 0.12), transparent 68%);
      filter: blur(8px);
      animation: pulseSoft 7s ease-in-out infinite;
    }

    .circuit {
      position: absolute;
      inset: auto 0 12% 0;
      height: 120px;
      z-index: -1;
      opacity: 0.35;
      pointer-events: none;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.35rem clamp(1.25rem, 4vw, 2rem);
      max-width: 1160px;
      width: 100%;
      margin: 0 auto;
      animation: fadeDown 0.7s ease both;
    }

    .topbar-mark {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 0.16em;
    }

    .topbar-mark img {
      width: 28px;
      height: 28px;
      border-radius: 7px;
    }

    .topbar-mark span { color: var(--teal); letter-spacing: 0.2em; font-size: 0.72rem; }

    .topbar a {
      font-size: 0.9rem;
      color: var(--muted);
      transition: color 0.2s;
    }
    .topbar a:hover { color: var(--teal); }

    .hero-stage {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      align-items: center;
      gap: clamp(1.5rem, 4vw, 3.5rem);
      max-width: 1160px;
      width: 100%;
      margin: 0 auto;
      padding: 0.5rem clamp(1.25rem, 4vw, 2rem) 4rem;
    }

    .hero-copy { animation: riseIn 0.95s cubic-bezier(0.22, 1, 0.36, 1) both; }

    .brand {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(4rem, 11vw, 7.2rem);
      line-height: 0.88;
      letter-spacing: -0.045em;
      color: #f4fbff;
      margin-bottom: 1.25rem;
      text-wrap: balance;
    }

    .brand i {
      font-style: normal;
      background: linear-gradient(120deg, var(--teal) 0%, #99f6e4 55%, var(--steel) 120%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lede {
      max-width: 26rem;
      font-size: clamp(1.05rem, 2vw, 1.22rem);
      color: var(--muted);
      font-weight: 400;
      margin-bottom: 2rem;
      letter-spacing: 0.01em;
    }

    .cta-stack { display: grid; gap: 0.85rem; justify-items: start; }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-download,
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3.05rem;
      padding: 0 1.45rem;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.98rem;
      border-radius: 3px;
      transition: transform 0.22s ease, background 0.22s ease, border-color 0.22s ease, color 0.22s ease;
    }

    .btn-download {
      background: var(--teal);
      color: #04201b;
      border: 1px solid transparent;
    }
    .btn-download:hover {
      background: #5eead4;
      transform: translateY(-2px);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.02);
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 600;
    }
    .btn-ghost:hover {
      border-color: rgba(45, 212, 191, 0.55);
      color: var(--teal);
    }

    .btn-meta {
      font-size: 0.88rem;
      color: var(--muted);
      padding-left: 0.1rem;
    }
    .btn-meta strong { color: #c8d9e6; font-weight: 600; }

    .hero-visual {
      position: relative;
      display: grid;
      place-items: center;
      animation: riseIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
    }

    .hero-visual__ring {
      position: absolute;
      width: min(94%, 480px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(45, 212, 191, 0.16);
      pointer-events: none;
    }
    .hero-visual__ring--outer {
      width: min(108%, 540px);
      border-color: rgba(74, 112, 145, 0.22);
      animation: spinSlow 56s linear infinite;
    }
    .hero-visual__ring--inner {
      animation: spinSlow 38s linear infinite reverse;
    }
    .hero-visual__ring--inner::before {
      content: "";
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--teal);
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
    }
    .hero-visual__ring--outer::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--steel);
      bottom: 18%;
      right: 10%;
    }

    .hero-visual img {
      position: relative;
      width: min(100%, 400px);
      height: auto;
      display: block;
      border-radius: 28px;
      filter: drop-shadow(0 28px 50px rgba(0, 0, 0, 0.5));
      animation: floatY 6s ease-in-out infinite;
    }

    /* —— Services —— */
    .section {
      position: relative;
      max-width: 1160px;
      margin: 0 auto;
      padding: 5rem clamp(1.25rem, 4vw, 2rem) 5.5rem;
    }

    .section::before {
      content: "";
      position: absolute;
      left: clamp(1.25rem, 4vw, 2rem);
      right: clamp(1.25rem, 4vw, 2rem);
      top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--line), transparent);
    }

    .section-head {
      margin-bottom: 2.25rem;
      max-width: 34rem;
      animation: riseIn 0.8s ease both;
      animation-timeline: view();
      animation-range: entry 10% cover 30%;
    }

    .section-kicker {
      display: inline-block;
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 0.7rem;
    }

    .section h2 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.85rem, 3.4vw, 2.45rem);
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 0.7rem;
    }

    .section-head p {
      color: var(--muted);
      font-size: 1.05rem;
    }

    .feature-list {
      list-style: none;
      display: grid;
      gap: 0.85rem;
    }

    .feature-list li {
      display: grid;
      grid-template-columns: minmax(8.5rem, 11rem) 1fr;
      gap: 1.25rem;
      align-items: center;
      padding: 1.35rem 1.4rem;
      border: 1px solid var(--line);
      background:
        linear-gradient(120deg, rgba(45, 212, 191, 0.04), transparent 42%),
        rgba(10, 18, 26, 0.55);
      transition: border-color 0.25s ease, transform 0.25s ease, background 0.25s ease;
    }

    .feature-list li:hover {
      border-color: rgba(45, 212, 191, 0.4);
      transform: translateX(4px);
      background:
        linear-gradient(120deg, rgba(45, 212, 191, 0.08), transparent 48%),
        rgba(12, 22, 30, 0.75);
    }

    .feature-list .tag {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--teal);
    }

    .feature-list .desc {
      color: #c5d4e0;
      font-size: 1.05rem;
      font-weight: 450;
    }

    footer {
      max-width: 1160px;
      margin: 0 auto;
      padding: 1.6rem clamp(1.25rem, 4vw, 2rem) 2.4rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.5rem;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.9rem;
      border-top: 1px solid transparent;
      background:
        linear-gradient(90deg, transparent, var(--line), transparent) top / 100% 1px no-repeat;
    }
    footer a { color: var(--muted); transition: color 0.2s; }
    footer a:hover { color: var(--teal); }

    @keyframes meshDrift {
      from { background-position: 0 0, 0 0; }
      to { background-position: 72px 36px, 72px 36px; }
    }
    @keyframes pulseSoft {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.06); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
    @keyframes spinSlow { to { transform: rotate(360deg); } }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 860px) {
      .hero-stage {
        grid-template-columns: 1fr;
        text-align: center;
        padding-bottom: 3rem;
      }
      .lede { margin-inline: auto; }
      .cta-stack, .cta-row { justify-items: center; justify-content: center; }
      .hero-visual { order: -1; margin-top: 0.4rem; }
      .hero-visual img { width: min(62vw, 260px); border-radius: 22px; }
      .hero-visual__ring--inner { width: min(78vw, 300px); }
      .hero-visual__ring--outer { width: min(90vw, 340px); }
      .feature-list li {
        grid-template-columns: 1fr;
        gap: 0.35rem;
        text-align: left;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

  <script>
    (function () {
      var feeds = [
        "https://cdn.jsdelivr.net/gh/qaqqqe1123/moses-update@main/latest.json",
        "https://raw.githubusercontent.com/qaqqqe1123/moses-update/main/latest.json",

      function tryFeed(i) {

          .catch(function () { tryFeed(i + 1); });
